[package]
name = "markov-strategy-registry"
version = "0.1.0"
edition = "2021"
description = "Markov strategy registry: a noncustodial Solana program that records immutable strategy version recipes"
license = "Apache-2.0"
publish = false

# Standalone crate: the JavaScript workspace above it is not a Cargo workspace.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "markov_strategy_registry"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-program = "=2.3.0"
solana-program-test = "=2.3.13"
solana-sdk = "=2.3.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
